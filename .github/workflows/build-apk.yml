      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Green Film APK
        working-directory: project/GreenFilm_Android_Private_v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare installer
        shell: bash
        run: cp project/GreenFilm_Android_Private_v2/app/build/outputs/apk/debug/app-debug.apk GreenFilm-v2.apk

      - name: Upload GreenFilm-v2.apk
        uses: actions/upload-artifact@v4
        with:
          name: GreenFilm-v2-APK
          path: GreenFilm-v2.apk
          if-no-files-found: error
