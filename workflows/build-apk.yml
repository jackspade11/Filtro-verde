GREENFILM_ZIP
          tr -d '\n\r' < /tmp/GreenFilm_Ready_To_Build.b64 | base64 -d > /tmp/GreenFilm_Ready_To_Build.zip
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q /tmp/GreenFilm_Ready_To_Build.zip -d "$GITHUB_WORKSPACE/project"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Green Film APK
        working-directory: project/GreenFilm_Android_Private
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare installer
        shell: bash
        run: cp project/GreenFilm_Android_Private/app/build/outputs/apk/debug/app-debug.apk GreenFilm.apk

      - name: Upload GreenFilm.apk
        uses: actions/upload-artifact@v4
        with:
          name: GreenFilm-APK
          path: GreenFilm.apk
          if-no-files-found: error
